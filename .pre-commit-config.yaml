exclude: '^(data|docs)/|(^|/)(__pycache__|\.ruff_cache|\.pytest_cache)/'
default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: micromamba run -n protein-hmm ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        args: ["--fix"]
      - id: ruff-format
        name: ruff format
        entry: micromamba run -n protein-hmm ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: mypy
        name: mypy
        entry: micromamba run -n protein-hmm python -m mypy
        language: system
        pass_filenames: false
        always_run: true
