version: 2
updates:
  - package-ecosystem: conda
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    ignore:
      # Python 3.14 already allows patch updates. Changing the minor version
      # also requires updating Ruff, mypy, and the pre-commit interpreter.
      - dependency-name: python
    groups:
      conda-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
